<html>
	<head>
		<title>Login page</title>
		<meta charset="utf-8">
				<meta name="viewport" content="width=device-width, initial-scale=1"><!--responsive class--->
				<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><!--tailwind cdn-->
	</head>
	<body class="bg-gradient-to-r from-blue-950 to-yellow-600 text-white">
	<p class="font-black text-4xl text-center mt-20 md:mt-40 xl:mt-20">Welcome Back</p>
	<p class="font-bold text-xl text-center mt-5">Your next story is waiting.</p>
	<p class="font-bold italic text-center mt-5">Sign in to your Readora Chronicles account and continue exploring the worlds you love.</p>
	<div class=" ml-5 md:ml-50 xl:ml-140 mt-10">
		<label>Email:</label>
		<input type="email" required placeholder="Enter your email"  class="border-2 rounded-xl p-2 w-80 ml-10"><br><br>
		<label>Password</label>
		<input type="text" placeholder="Enter your Password" required class="border-2 rounded-xl p-2 w-80 ml-4"><br><br>
		<button class="border-2 ml-40 md:ml-50 xl:ml-50 rounded-xl p-2 bg-blue-900 font-bold text-white"><a href="index.html">SIGN IN</a></button>

	</div>
	</body>
</html>
